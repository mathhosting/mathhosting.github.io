<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SardorChat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- ===== AUTH SECTION ===== -->
  <div id="authContainer">
    <h1>Welcome to SardorChat</h1>

    <div class="authBox">
      <h2>Login</h2>
      <input id="loginUsername" placeholder="Username">
      <input id="loginPassword" placeholder="Password" type="password">
      <button id="loginBtn">Login</button>
    </div>

    <div class="authBox">
      <h2>Register</h2>
      <input id="regUsername" placeholder="Username">
      <input id="regPassword" placeholder="Password" type="password">
      <input id="regProfile" placeholder="Profile Picture URL">
      <button id="registerBtn">Register</button>
    </div>
  </div>

  <!-- ===== CHAT APP SECTION ===== -->
  <div id="chatApp" style="display:none;">
    <div id="topBar">
      <h2>SardorChat</h2>
      <button id="logoutBtn">Logout</button>
    </div>

    <div id="mainContainer">
      <!-- Users list -->
      <div id="usersContainer" class="usersList"></div>

      <!-- Chat area -->
      <div class="chatArea">
        <div id="chatContainer" class="messages"></div>
        <div class="messageInputBox">
          <input id="messageInput" placeholder="Type a message">
          <button id="sendBtn">Send</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
